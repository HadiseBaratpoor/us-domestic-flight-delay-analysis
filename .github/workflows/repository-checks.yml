name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source, notebook, and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Validate source, notebook, and local documentation links
        run: python scripts/check_repository.py

      # Preserve historical outputs. This is deliberately a non-executing export.
      - name: Export historical notebook to HTML
        run: >-
          jupyter nbconvert --to html
          --output-dir local-exports/notebook
          Domestic_Flights_Data_Mining.ipynb

      - name: Upload historical notebook preview
        uses: actions/upload-artifact@v7
        with:
          name: historical-notebook-preview
          path: local-exports/notebook/*.html
          if-no-files-found: error
          retention-days: 14

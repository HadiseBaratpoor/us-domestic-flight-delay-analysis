name: Dataset reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: Reproduce dataset summaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Regenerate summaries and chart
        run: python scripts/profile_dataset.py --output-dir local-exports/ci-profile

      - name: Compare regenerated results with committed reports
        run: python scripts/check_profile.py local-exports/ci-profile

      # Keep regenerated reports available when a comparison fails, too.
      - name: Upload regenerated dataset reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-dataset-profile
          path: local-exports/ci-profile/
          if-no-files-found: error
          retention-days: 14
